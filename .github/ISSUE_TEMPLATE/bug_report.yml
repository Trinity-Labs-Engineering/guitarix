name: Bug Report
description: Report a reproducible bug or regression.
title: "[BUG] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting an issue. Please provide enough detail for the problem to be reproduced and investigated.

  - type: dropdown
    id: status
    attributes:
      label: Status
      description: Select the current state of the issue.
      options:
        - Open
        - In progress
        - Blocked
        - Solved
      default: 0
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: Describe the problem clearly and concisely.
      placeholder: Explain what is happening and why it is a problem.
    validations:
      required: true

  - type: textarea
    id: involves
    attributes:
      label: Involves
      description: List the repositories, applications, services, firmware modules, or hardware involved.
      placeholder: |
        - Houston
        - Launchpad
        - artemis-fw
    validations:
      required: true

  - type: textarea
    id: current-behaviour
    attributes:
      label: Current Behaviour
      description: What currently happens?
      placeholder: Describe the observed behaviour.
    validations:
      required: true

  - type: textarea
    id: expected-behaviour
    attributes:
      label: Expected Behaviour
      description: What should happen instead?
      placeholder: Describe the expected behaviour.
    validations:
      required: true

  - type: textarea
    id: replication-steps
    attributes:
      label: Replication Steps
      description: Provide the exact steps required to reproduce the issue.
      placeholder: |
        1. Open ...
        2. Select ...
        3. Perform ...
        4. Observe ...
    validations:
      required: true

  - type: input
    id: build-hash
    attributes:
      label: Build Hash
      description: Enter the relevant commit or build hash, where available.
      placeholder: e.g. 8c42f15

  - type: textarea
    id: error-messages
    attributes:
      label: Error Messages
      description: Paste any relevant logs, console output, or error messages.
      render: text
      placeholder: Paste error output here.

  - type: textarea
    id: investigation
    attributes:
      label: Investigation Required
      description: Note any suspected areas that should be inspected.
      placeholder: |
        - Confirm the correct UART command is sent.
        - Inspect the firmware state machine.
        - Check timing and timeout behaviour.

  - type: textarea
    id: possible-fix
    attributes:
      label: Possible Fix
      description: Describe any suspected cause or proposed fix.
      placeholder: Outline a possible implementation or investigation path.

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance Criteria
      description: Define the conditions that must be met before this issue can be closed.
      placeholder: |
        - [ ] The issue can no longer be reproduced.
        - [ ] The fix has been tested on target hardware.
        - [ ] No related regression has been introduced.

  - type: input
    id: assign-to
    attributes:
      label: Assign To
      description: Enter the suggested assignee.
      placeholder: GitHub username or team member name

  - type: textarea
    id: comments
    attributes:
      label: Comments
      description: Add any other relevant notes, context, screenshots, or links.
      placeholder: Additional information.
